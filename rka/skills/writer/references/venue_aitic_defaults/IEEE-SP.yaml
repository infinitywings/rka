# Venue-default anti-AI-tic overrides for IEEE S&P (and systems/security venues
# of similar register). Loaded by ai_tic_lint.py --venue IEEE-SP and merged
# UNDER the per-project ai_tic_config.yaml (project entries win).
#
# P5 recalibration rationale: the lexical blocklist is sourced from Kobak 2025
# and Matsui 2025 (real post-ChatGPT frequency spikes), but a handful of those
# terms are register-legitimate in systems/security prose and over-flag here.
# These downgrades move them from HIGH (block) to MEDIUM (warn) so the author
# still sees them but the compile is not blocked. Detector-style hard blocking
# is unreliable (61.3% false positives on non-native English, Liang 2023);
# structural detectors (sentence-variance, transition-ratio, bridge-repetition)
# remain the primary signal and are unchanged.
#
# NOT downgraded on purpose: "robust" and "secure" — the IEEE-SP venue file
# forbids these unless formally defined, so the linter should keep flagging them.

enhance:        # "enhance throughput", "enhance the security guarantee" — standard
  verdict: downgrade
  rationale: "Register-legitimate in systems/security evaluation prose."

comprehensive:  # "a comprehensive evaluation across N configurations"
  verdict: downgrade
  rationale: "Standard in systems evaluation sections."

notably:        # "notably, the attack succeeds even under rate limiting"
  verdict: downgrade
  rationale: "Common in human-authored security prose; weak standalone marker."

utilize:        # tolerated, but prefer "use"; warn rather than block
  verdict: downgrade
  rationale: "Verbose but not an AI tell on its own in this register."
