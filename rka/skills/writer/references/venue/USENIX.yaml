schema_version: v1
id: USENIX
name: USENIX Security Symposium
kind: conference
domain: cs-security
status: active
pin_year: 2025

submission:
  page_limit_main: 13
  page_limit_camera_ready: null
  references_counted: false
  appendix_counted: false
  appendix_limit: null
  has_required_checklist: false
  anonymization: required_pre_camera_ready

format:
  template_id: usenix2019
  engine_default: pdflatex
  engines_supported: [pdflatex]
  citation_style: numeric-cite-order
  bibliography_style: numeric-cite-order

structure:
  required_sections:
    - Abstract
    - Introduction
    - Background and Related Work
    - Threat Model
    - System Design
    - Evaluation
    - Conclusion
    - References
  optional_sections:
    - Implementation
    - Discussion
    - Limitations
  appendix_sections:
    - Artifact Evaluation appendix
    - Additional measurement data
    - Source-code excerpts
    - Disclosure timeline (vuln work)
  section_order:
    - Introduction
    - Background and Related Work
    - Threat Model
    - System Design
    - Implementation
    - Evaluation
    - Discussion
    - Limitations
    - Conclusion
    - References
  abstract_word_min: 100
  abstract_word_target: 200
  abstract_word_max: 200

tone:
  voice: first-person-plural
  hedging: low
  marketing_language: discouraged
  math_density: moderate
  numerical_claims_dominate: true
  ablation_studies_expected: false
  multi_seed_required: false
  reproducibility_floor: high

review_dimensions:
  - {name: technical_soundness, weight: high}
  - {name: novelty, weight: high}
  - {name: threat_model_clarity, weight: high}
  - {name: evaluation_rigor, weight: high}
  - {name: practical_impact, weight: medium}
  - {name: artifact_quality, weight: medium}

forbidden_constructions:
  - pattern: "we propose a novel"
    reason: "overused; USENIX reviewers flag the novelty cliché"
    severity: warn
  - pattern: "robust"
    reason: "requires specific attack-class bounds"
    severity: warn
  - pattern: "secure"
    reason: "requires formal definition or bounded threat-model claim"
    severity: warn

sample_corpus:
  query_method: openalex
  filter_template: "primary_location.source.id:S4210207009,publication_year:{year}"
  recommended_year_range: [2024, 2025]
  diversity_topics:
    - systems_security
    - applied_cryptography
    - network_security
    - hardware_security
    - ml_security
  rka_tag: "venue-sample:USENIX"

cfp:
  primary_url: https://www.usenix.org/conference/usenixsecurity25
  author_guide_url: https://www.usenix.org/conferences/author-resources/paper-templates
  checklist_url: https://secartifacts.github.io/
  last_verified: 2026-05-26

provenance:
  schema_origin: dec_01KS2S22VV5P5SWWXNBXQDHMGX
  last_updated: 2026-05-26
