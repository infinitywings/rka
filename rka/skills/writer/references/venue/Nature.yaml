schema_version: v1
id: Nature
name: Nature
kind: journal
domain: sci-general
status: active
pin_year: 2025

submission:
  # Nature uses word count, not page count, as the binding constraint.
  # page_limit_main treats 5000 words ≈ 10 typeset pages as an
  # approximation; ai_tic_lint will be extended in W2 to read the
  # word-count constraint from a dedicated `submission.word_limit_main`
  # field once Nature-family venues motivate the schema bump.
  page_limit_main: null
  page_limit_camera_ready: null
  references_counted: false
  appendix_counted: false
  appendix_limit: null
  has_required_checklist: true
  anonymization: none

format:
  template_id: nature_official
  engine_default: pdflatex
  engines_supported: [pdflatex, lualatex, xelatex]
  citation_style: vancouver
  bibliography_style: numeric-cite-order

structure:
  required_sections:
    - Title
    - Lead paragraph
    - Body
    - Results
    - Discussion
    - Methods
    - References
    - Author Contributions
    - Competing Interests
    - Data Availability
    - Code Availability
  optional_sections:
    - Acknowledgments
    - Extended Data
    - Supplementary Information
  appendix_sections:
    - Extended Data figures (up to 10)
    - Extended Data tables (up to 10)
    - Supplementary Information PDF
    - Reporting Standard checklists (CONSORT / STROBE / PRISMA)
  section_order:
    - Title
    - Lead paragraph
    - Body
    - Results
    - Discussion
    - Methods
    - References
    - Acknowledgments
    - Author Contributions
    - Competing Interests
    - Data Availability
    - Code Availability
    - Extended Data
    - Supplementary Information
  abstract_word_min: 150
  abstract_word_target: 175
  abstract_word_max: 200

tone:
  voice: first-person-plural
  hedging: moderate
  marketing_language: discouraged
  math_density: low
  numerical_claims_dominate: false
  ablation_studies_expected: false
  multi_seed_required: false
  reproducibility_floor: high

review_dimensions:
  - {name: scientific_significance, weight: high}
  - {name: novelty, weight: high}
  - {name: cross_discipline_accessibility, weight: high}
  - {name: methodological_rigor, weight: high}
  - {name: data_and_code_availability, weight: high}

forbidden_constructions:
  - pattern: "we propose a novel"
    reason: "overused; flagged given Nature's narrative-first emphasis"
    severity: warn
  - pattern: "groundbreaking"
    reason: "Nature's editors strip marketing language in editing"
    severity: warn
  - pattern: "paradigm-shifting"
    reason: "Nature's editors strip marketing language in editing"
    severity: warn
  - pattern: "it is important to note"
    reason: "Nature's word budget makes empty connectives costly"
    severity: warn
  - pattern: "comprehensive"
    reason: "vague hedge against scope criticism; specify the scope"
    severity: warn

sample_corpus:
  query_method: openalex
  filter_template: "primary_location.source.id:S<TBD>,publication_year:{year}"
  recommended_year_range: [2024, 2025]
  diversity_topics:
    - subfield_specific
  rka_tag: "venue-sample:Nature"

cfp:
  primary_url: https://www.nature.com/nature/for-authors/initial-submission
  author_guide_url: https://www.nature.com/nature/for-authors
  checklist_url: https://www.nature.com/nature-portfolio/editorial-policies/reporting-standards
  last_verified: 2026-05-26

provenance:
  schema_origin: dec_01KS2S22VV5P5SWWXNBXQDHMGX
  last_updated: 2026-05-26
