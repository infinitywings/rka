schema_version: v1
id: NSF-PAPPG
name: NSF Proposal and Award Policies and Procedures Guide (general baseline)
kind: proposal
domain: proposal
status: active

# This file is the cross-solicitation NSF baseline. Specific
# solicitations (CAREER, GRFP, individual program calls) inherit from
# this file via `inherits_from: NSF-PAPPG` and override only the
# sections that differ -- typically page limits on the Project
# Description, optional sections, and review criteria framing.
#
# Reference: NSF PAPPG (current revision at
# https://www.nsf.gov/publications/pub_summ.jsp?ods_key=pappg).
# Key numbers below reflect the PAPPG Chapter II.D.2 generic
# requirements; consult the active solicitation for any deviation.

submission:
  # PAPPG Chapter II.D.2: Project Description maximum is 15 pages
  # (most programs). Some solicitations override to 12 or 25 -- always
  # check the active solicitation's "Format Requirements" section.
  page_limit_main: 15
  # NSF counts the Project Description toward the page limit. Other
  # required sections (Project Summary, References Cited,
  # Biographical Sketches, Budget Justification, Current and Pending
  # Support, Facilities/Equipment/Other Resources, Data Management
  # and Sharing Plan, Mentoring Plan) are separately page-limited or
  # unlimited per PAPPG.
  references_counted: false
  appendix_counted: false
  has_required_checklist: true
  anonymization: none

format:
  # NSF requires 11-point or larger (Computer Modern 11pt; or
  # Times/Cambria/Arial/Helvetica/Palatino at 10pt+; or any other
  # font at 11pt+). 1-inch margins. Single-spaced.
  template_id: nsf_pappg_generic
  engine_default: pdflatex
  engines_supported: [pdflatex, lualatex, xelatex]
  citation_style: numeric-cite-order
  bibliography_style: numeric-cite-order

structure:
  # Standard NSF proposal cover sheet to the Data Management Plan, in
  # the order required by Research.gov / FastLane. The Project
  # Description body itself MUST include the Intellectual Merit and
  # Broader Impacts headings.
  required_sections:
    - Cover Sheet
    - Project Summary
    - Project Description
    - Intellectual Merit
    - Broader Impacts
    - References Cited
    - Biographical Sketches
    - Budget and Budget Justification
    - Current and Pending Support
    - Facilities, Equipment, and Other Resources
    - Data Management and Sharing Plan
  optional_sections:
    - Postdoctoral Mentoring Plan
    - Letters of Collaboration
    - List of Project Personnel and Partner Organizations
    - Special Information and Supplementary Documentation
  section_order:
    - Cover Sheet
    - Project Summary
    - Project Description
    - References Cited
    - Biographical Sketches
    - Budget and Budget Justification
    - Current and Pending Support
    - Facilities, Equipment, and Other Resources
    - Data Management and Sharing Plan
    - Postdoctoral Mentoring Plan
    - Letters of Collaboration
  # Project Summary: 1 page max -- per PAPPG Chapter II.D.2.b.
  abstract_word_min: 200
  abstract_word_target: 350
  abstract_word_max: 500

tone:
  voice: first-person-plural
  hedging: low
  marketing_language: neutral
  math_density: moderate
  numerical_claims_dominate: false
  ablation_studies_expected: false
  multi_seed_required: false
  reproducibility_floor: moderate

review_dimensions:
  # NSF Merit Review Criteria (PAPPG Chapter III.A): every proposal
  # must explicitly address Intellectual Merit and Broader Impacts.
  - {name: intellectual_merit, weight: high}
  - {name: broader_impacts, weight: high}
  - {name: clarity, weight: medium}

forbidden_constructions:
  - pattern: "groundbreaking"
    reason: "marketing-heavy claim; NSF panels prefer specific, falsifiable plans"
    severity: warn
  - pattern: "world-class"
    reason: "marketing-heavy; replace with measurable competitive positioning"
    severity: warn

cfp:
  primary_url: https://www.nsf.gov/publications/pub_summ.jsp?ods_key=pappg
  author_guide_url: https://www.research.gov/research-portal/appmanager/base/desktop
  last_verified: 2026-05-27

provenance:
  schema_origin: phase-W4-NSF-PAPPG-baseline
  last_updated: 2026-05-27
