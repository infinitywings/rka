[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rka-orchestrator"
# 0.6.8 → 0.6.9: D4 extraction-dependency injection. Adds the 8 pinned
# Python packages the hyperscaler-auditing project's D4 extractor needs
# at subprocess runtime (openai, pandas, edgartools, krippendorff, numpy,
# duckdb, scikit-learn, wrds). Per the PI's ratified call on
# 2026-06-03T22:Xz (dec_01KT85N294D1GSFQPPX7SVSB5G): pin v0.6.8 / 8989a79
# as the functional base; everything in agentic since (cred-vault Phase
# 1 absorption from main, commits 89e7dc1 / baf2402 / 569b9e9 / be693af)
# is rka/* doc work that does NOT enter the orchestrator container build,
# so the rebuilt image is functionally v0.6.8 + these 8 deps.
# Empirical motivation: jrn_01KT7E55DQ2G3KG9AJ3ZZJGA33 finding #3 — the
# Executor subprocess runs python in the rka-orchestrator container,
# where the 8 packages all failed to import (container had only
# langgraph/httpx/claude-agent-sdk). Host .venv was unusable because it
# was macOS arm64 vs the Linux container. Installing into the image is
# the canonical fix.
# Bumped 0.1.0 → 0.6.0 at v2.6.0+agentic release to acknowledge
# Phase A → Phase-X² polish maturation. The +agentic tag train is
# the RKA-side anchor; this package version is an independent
# pre-1.0 semver line that tracks the orchestrator's surface
# evolution. Major-digit (0.X) bumped per shipped phase band;
# resets on a future 1.0 cut.
# 0.6.0 → 0.6.1: Phase D2.6 async-resume watchdog patch — closes
# the silent post-segment stall failure mode via probe-and-retry
# in _background_segment + runner-side post-invoke hardening.
# 0.6.1 → 0.6.2: Phase-X²' polish — schema-divergence validation
# chain. Closes the field-NAME validator gap (mirror of Phase-X²'s
# field-VALUE work): TOOL_REQUIRED_FIELDS + check_required_fields,
# `content` alias on rka_submit_checkpoint adapter, canonical-name
# block in BRAIN/EXECUTOR_SYSTEM, PI diagnostic surface on
# pi_acceptance.
# 0.6.2 → 0.6.3: registry fix — add `zotero-mcp` to always-on
# baseline so Brain/Executor subprocesses inherit Zotero tools to
# match the daemon's pre-existing per-project Zotero plumbing
# (set_project_zotero_collection / /projects/{id}/zotero_collection
# endpoint / zotero_client.py from commit 6e19486). Closes the
# manifest-asymmetry bug surfaced 2026-06-01 where PI session had
# zotero MCP but Executor subprocess did not.
# 0.6.3 → 0.6.4: in-place manifest extension — adds
# orchestrator_extend_manifest(project_id, tool_name) MCP tool +
# POST /projects/{id}/manifest/tools endpoint + find_tool_by_name
# registry lookup. Closes the second half of the manifest-asymmetry
# bug: projects onboarded BEFORE a registry addition (e.g.
# prj_01KSMW9RBFXRY6HRRADH3SX7ZP onboarded 2026-05-28 01:57 UTC
# before zotero hit the registry on 2026-06-01 13:34 UTC) can now
# add the missing tool in-place without re-running the full Phase D
# onboarding wizard.
# 0.6.4 → 0.6.5: hot-patch — back-fill the `shared_with` semantic
# field on SecretDecl (was written into user-added manifest entries
# by Phase D onboarding but never declared on the dataclass) +
# forward-compat filter on ToolManifest.from_dict's nested SecretDecl
# and ToolDecl reconstruction so a persisted manifest with unknown
# nested fields round-trips cleanly. Empirical regression surfaced
# by F2's extend-manifest round-trip against
# prj_01KSMW9RBFXRY6HRRADH3SX7ZP (sec-xbrl-structured's secret
# carried shared_with='sec-edgar').
# 0.6.5 → 0.6.6: capability-allowlist validator unification.
# Lifts the existing inline per-action capability check into
# rka_enums.check_action_capability (composable + unit-testable;
# behaviorally identical) + extends BRAIN_SYSTEM with capability-
# bucket enumeration so Brain self-prunes mission_lifecycle
# proposals in execution-only segments. Empirical motivation:
# PA-4 of mis_01KT0HP12N51TXXKGKQ097RD1P (chk_01KT2D8VY6YZ...,
# since resolved) — Brain proposed rka_update_mission_status whose
# capability was not in the workflow's allowed_capabilities; the
# check correctly rejected it, but the gap was Brain not knowing
# the constraint at proposal time.
# 0.6.6 → 0.6.7: v2.6.0+agentic.7 — closes the CRITICAL regression
# v2.6.3 introduced for the orchestrator's SDK subprocess. v2.6.3
# split the RKA MCP tool surface into 12 always-on + 79 deferred
# tools, with 3 new navigator tools (rka_load_tools, rka_list_tools,
# rka_help) to bring deferred tools online at runtime. The
# subprocess's static allowed_tools list was pre-populated with
# rka MCP tools by name — but the 3 navigator tools were not
# added, so the subprocess could never call them, and therefore
# could never reach the 79 deferred RKA tools. Net effect:
# orchestrator backend regressed from 91 callable RKA tools to 12.
# This patch (a) adds the 3 navigator tools to READ_TOOLS so they
# join the subprocess's allowed_tools list, (b) extends
# BRAIN_SYSTEM + EXECUTOR_SYSTEM with a "Tool surface (v2.6.3+)"
# section teaching each role about the navigator architecture and
# how to call rka_load_tools when a deferred tool is needed,
# (c) bumps the READ_TOOLS lock-test from 14 to 17.
# 0.6.9 → 0.6.10: Phase S4 — per-call LLM-timeout layer. Adds
# `SDKTimeoutError` + `timeout_s` kwarg on `SDKClient.complete()`
# (Protocol-level seam); wraps the real impl's streaming loop in
# `asyncio.wait_for`; wires per-node constants
# (SDK_TIMEOUT_DEFAULT_S=240s, SDK_TIMEOUT_BACKBRIEF_S=480s,
# SDK_TIMEOUT_TOOL_USE_S=600s) into all 9 `sdk.complete()` call
# sites in nodes/brain.py (6) + nodes/executor.py (3); on hit a
# classified `llm_call_timeout` ErrorRecord routes through
# `escalation_router`. Complementary to Phase D2.6 segment-level
# watchdog: this layer catches a single hung LLM call BEFORE the
# segment ever finishes, so the PI sees a specific cause rather
# than the watchdog's opaque "no progress" escalation. Empirical
# motivation: PI cockpit reported backbrief stall measured in
# minutes during 2026-06-03 hyperscaler-auditing Run-5 (thr_19e8...).
# +18 tests in test_sdk_timeouts.py covering Protocol contract,
# asyncio.wait_for integration, per-node wraps (9 sites), and
# coverage-gate lock-tests that fail if a new sdk.complete() call
# site ships without the try/except.
# 0.6.10 → 0.6.11: sandbox hardening (single-user review Tier 2).
# (a) fs_actuator — order-independent `rm` recursive+force detection.
# The literal `rm\s+-rf` regex in both DENY and RATIFY tiers let
# `rm -fr`, `rm -Rf`, `rm -r -f`, `rm -rfv`, `rm --recursive --force`
# slip through BOTH tiers and auto-execute. New
# `_rm_recursive_force_targets` parses flags in any order/grouping;
# recursive+force on host-root/$HOME/~ → DENY, any recursive+force →
# RATIFY. (b) llm_client — egress audit + control for WebFetch/
# WebSearch. Previously auto-allowed with no inspection. Now the
# can_use_tool hook audit-logs every egress, denies known telemetry
# endpoints (notifications.WEBHOOK_BLOCKLIST floor), and honors an
# opt-in strict allowlist (ORCHESTRATOR_EGRESS_ALLOWLIST) — default
# stays open since the research workflow needs web access, and the
# credential-exfil target is already removed by Phase E1
# `_enforce_workspace_mount_safety` (daemon refuses to mount $HOME /
# credential dirs). The review's "narrow the bind mount" item was
# already satisfied by E1. +56 tests (test_fs_actuator_rm_flags.py +
# egress cases in test_fs_actuator_hook.py). NOT included:
# pi_decision_select correct→redraft — a privileged-autonomy-gate
# design decision (redraft target + EC8 set-identity) deferred for
# explicit PI input per the long-standing deferred-followup note.
# 0.6.11 → 0.6.12: pi_decision_select in-run redraft (the deferred
# 0.6.11 item, now that the PI ratified the re-strategize target).
# On a `correct` at the pi_decision_select TWO-TAP gate, the run no
# longer dead-ends at escalation_router (which synthesized an
# unclassified checkpoint and dropped the correction in-run). New
# `mission_redraft` node (executor.py) makes ONE LLM call to REVISE
# proposed_actions incorporating the PI's correction — it does NOT
# re-run mission_execute's workspace work (no re-doing Bash/edits) —
# then routes back to decision_present, which re-renders the revised
# actions and re-parks pi_decision_select for re-ratification. EC8
# set-identity holds: the PI ratifies the NEW proposed set at the
# re-parked gate. Bounded by MAX_DECISION_REDRAFTS=3; on cap /
# defensive escape emits a real classified ErrorRecord and escalates.
# `_route_after_pi_decision` rewired to three-way (correct→
# mission_redraft, accept→execute_ratified_actions, reject→
# escalation_router), sentinel short-circuit preserved at the top.
# NODE_NAMES 18→19. +12 tests (test_mission_redraft.py); 3 lock-tests
# updated. Full orchestrator suite: 1340 passed.
# 0.6.13 → 0.6.14: Opus 4.8 lifecycle-eval fixes plus a scientifically
# isolated Arm-B baseline. The plain-Claude arm now requires a fresh workspace,
# exposes exactly Bash/Read/Write under strict empty MCP/settings/skills/plugin
# configuration plus sandbox/hooks, masks inherited billing/research secrets,
# and uses an arm-neutral capability contract that leaves RKA traceability to
# the provenance axis.
version = "0.6.14"
description = "RKA + LangGraph orchestrator (Phase A → Phase-X² polish; agentic branch)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "RKA team" }]
dependencies = [
    "langgraph>=1.2,<2.0",
    "langgraph-checkpoint-sqlite>=3.0,<4.0",
    "claude-agent-sdk>=0.1.81,<0.2",
    "mcp>=1.27,<2.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    # Gap 4a — bash AST parsing in fs_actuator's destructive-command
    # classifier. Catches regex bypasses like `RM=rm; $RM -rf /` by
    # tracking variable assignments and resolving references before
    # pattern-matching. Optional in spirit — if absent, classifier
    # falls back to pure-regex (the Phase G MVP behavior).
    "bashlex>=0.18",
    # v0.6.9 — D4 extraction-dependency injection (hyperscaler-auditing).
    # The 8 pinned packages from the PI's D2 chain
    # (jrn_01KT6YDEJNXHTN3Z6V5SM34EHM, ratified at chk_01KT2D8VW...).
    # openai >= 2: D4 extractor uses the v2 client (v1 has the
    # DeepSeek-client break). edgartools >= 5: SEC EDGAR 10-K text
    # retrieval. wrds: Wharton Research Data Services Python client
    # for cross-source reconciliation. pandas/numpy/duckdb/sklearn/
    # krippendorff: extraction + Phase-2 reliability-validation math.
    "openai>=2.40,<3",
    "pandas>=3.0,<4",
    "edgartools>=5.35,<6",
    "krippendorff>=0.8,<1",
    "numpy>=2.4,<3",
    "duckdb>=1.5,<2",
    "scikit-learn>=1.9,<2",
    "wrds>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
]

[project.scripts]
rka-orchestrator = "orchestrator.main:cli"
rka-orchestrator-mcp = "orchestrator.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["orchestrator*"]

[tool.setuptools.package-data]
"orchestrator.db" = ["*.sql"]
"orchestrator.data" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
