[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rka-orchestrator"
# Bumped 0.1.0 → 0.6.0 at v2.6.0+agentic release to acknowledge
# Phase A → Phase-X² polish maturation. The +agentic tag train is
# the RKA-side anchor; this package version is an independent
# pre-1.0 semver line that tracks the orchestrator's surface
# evolution. Major-digit (0.X) bumped per shipped phase band;
# resets on a future 1.0 cut.
# 0.6.0 → 0.6.1: Phase D2.6 async-resume watchdog patch — closes
# the silent post-segment stall failure mode via probe-and-retry
# in _background_segment + runner-side post-invoke hardening.
# 0.6.1 → 0.6.2: Phase-X²' polish — schema-divergence validation
# chain. Closes the field-NAME validator gap (mirror of Phase-X²'s
# field-VALUE work): TOOL_REQUIRED_FIELDS + check_required_fields,
# `content` alias on rka_submit_checkpoint adapter, canonical-name
# block in BRAIN/EXECUTOR_SYSTEM, PI diagnostic surface on
# pi_acceptance.
# 0.6.2 → 0.6.3: registry fix — add `zotero-mcp` to always-on
# baseline so Brain/Executor subprocesses inherit Zotero tools to
# match the daemon's pre-existing per-project Zotero plumbing
# (set_project_zotero_collection / /projects/{id}/zotero_collection
# endpoint / zotero_client.py from commit 6e19486). Closes the
# manifest-asymmetry bug surfaced 2026-06-01 where PI session had
# zotero MCP but Executor subprocess did not.
version = "0.6.3"
description = "RKA + LangGraph orchestrator (Phase A → Phase-X² polish; agentic branch)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "RKA team" }]
dependencies = [
    "langgraph>=1.2,<2.0",
    "langgraph-checkpoint-sqlite>=3.0,<4.0",
    "claude-agent-sdk>=0.1.81,<0.2",
    "mcp>=1.27,<2.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    # Gap 4a — bash AST parsing in fs_actuator's destructive-command
    # classifier. Catches regex bypasses like `RM=rm; $RM -rf /` by
    # tracking variable assignments and resolving references before
    # pattern-matching. Optional in spirit — if absent, classifier
    # falls back to pure-regex (the Phase G MVP behavior).
    "bashlex>=0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
]

[project.scripts]
rka-orchestrator = "orchestrator.main:cli"
rka-orchestrator-mcp = "orchestrator.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["orchestrator*"]

[tool.setuptools.package-data]
"orchestrator.db" = ["*.sql"]
"orchestrator.data" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
