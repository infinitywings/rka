# =============================================================
# Compose overlay — adds the rka-orchestrator daemon
#
# Usage:
#   docker compose -f docker-compose.yml \
#                  -f orchestrator/docker-compose.yml up -d --build
#
# This file is loaded ONLY when explicitly named via -f, so the
# baseline `docker compose up -d` workflow at the repo root is
# unchanged. Preserves the "CLAUDE.md is the only root file this
# branch modifies" agentic-branch constraint.
#
# Auth: the daemon's claude-agent-sdk subprocess needs Claude Max
# credentials via CLAUDE_CODE_OAUTH_TOKEN env — set in orchestrator/.env
# after running `claude setup-token` on the host once to mint a
# long-lived token. This is the only supported auth path for the daemon
# (the host's ~/.claude/.credentials.json bind-mount was removed in
# Phase D2.3 — see below — because the read-only mount triggered EROFS
# when the SDK's Bash tool tried to write its shell-snapshot state
# under /root/.claude/shell-snapshots/).
# =============================================================

services:
  rka-orchestrator:
    build:
      # Paths in overlays are resolved against the PROJECT root (the
      # dir of the first -f file), not this overlay's dir. So context
      # = "." means /Volumes/.../rka, and the Dockerfile path is
      # relative to that.
      context: .
      dockerfile: orchestrator/Dockerfile
    container_name: rka-orchestrator
    ports:
      - "9713:9713"
    env_file:
      # Optional — created locally if you're using the
      # CLAUDE_CODE_OAUTH_TOKEN auth path. Gitignored.
      # Path is resolved against the PROJECT root (the dir of the
      # first -f file), so include the orchestrator/ prefix.
      - path: orchestrator/.env
        required: false
    volumes:
      - orchestrator-data:/data
      # Phase D2.3: the host's ~/.claude:/root/.claude:ro mount was
      # REMOVED here. The :ro mount blocked the SDK Bash tool from
      # writing its shell-snapshot state under
      # /root/.claude/shell-snapshots/, surfacing as EROFS
      # ("read-only filesystem") on every Bash call — empirically
      # observed across three consecutive runs of the hyperscaler-
      # auditing mission. The daemon now uses CLAUDE_CODE_OAUTH_TOKEN
      # (priority-2 auth path) exclusively, and the container's
      # /root/.claude/ is a writable container-local directory for
      # session state, shell snapshots, transcripts, file history,
      # etc. Side effect: host .claude session state is no longer
      # visible inside the container (by design — daemon and host PI
      # sessions should be isolated). If CLAUDE_CODE_OAUTH_TOKEN
      # expires, run `claude setup-token` on the host and update
      # orchestrator/.env.
      #
      # The host's ~/.claude.json (single file, separate from the
      # .claude/ directory) holds the CLI's global config — user
      # email, last-active-project, etc. The claude CLI 2.x looks for
      # this file and prints a warning + suggests restoring from
      # ./claude/backups/ when missing. Mount it read-only so the
      # container's claude subprocess can read settings without
      # writing back to the host file. Single-file mounts are never
      # written to by the SDK (only read), so no EROFS risk here.
      - ${HOME}/.claude.json:/root/.claude.json:ro
      # PI's workspace root, mounted at the SAME absolute path inside
      # the container as on the host so paths the PI types
      # (project_workspaces.workspace_path) resolve identically for the
      # daemon's claude-agent-sdk subprocess. Default $HOME covers the
      # typical ~/Research/{slug} layout; override HOST_WORKSPACE_ROOT
      # in the REPO-ROOT .env (NOT orchestrator/.env — that file is
      # loaded via env_file: above and only populates container env;
      # it does NOT feed Compose YAML interpolation). For a non-HOME
      # parent (external drives, /Volumes/base/projects, etc.), put
      # HOST_WORKSPACE_ROOT=/your/path in /Volumes/base/workspace/rka/.env
      # (gitignored) or export it in the shell before docker compose up.
      # The Executor subprocess (and the Brain when it needs to ground
      # reasoning in workspace files) reads/writes here using the host
      # paths the PI sees, no translation. Docker Desktop may need
      # filesystem access granted for non-$HOME roots (System Settings →
      # Privacy → Full Disk Access).
      - ${HOST_WORKSPACE_ROOT:-${HOME}}:${HOST_WORKSPACE_ROOT:-${HOME}}:rw
    environment:
      RKA_API_URL: "http://rka:9712"
      ORCHESTRATOR_DB_PATH: "/data/orchestrator.db"
      ORCHESTRATOR_SAVER_PATH: "/data/orchestrator-saver.db"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - rka
    restart: unless-stopped

volumes:
  orchestrator-data:
