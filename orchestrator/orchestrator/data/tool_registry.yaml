# =============================================================
# Orchestrator tool registry — Phase D Q3 ratification.
#
# Curated shortlist of trusted defaults the Brain consults FIRST during
# `research_toolkit_node`, before augmenting with SerpAPI web search.
#
# Two sections:
#   - `always_on`: tools every project gets offered (the baseline
#     subprocess MCP surface). PI can still opt-out individual entries
#     at pi_toolkit_ratify.
#   - `by_domain`: domain-specific add-ons. The Brain selects relevant
#     domains based on PI's topic/field/venue from pi_onboarding_topic,
#     then surfaces those tools as candidates.
#
# Each entry is shaped like a ToolDecl from manifest.py (subset). Brain
# converts these to ToolDecl instances after PI ratifies. Auth metadata
# (probe_url + probe_header) lives here too so the credential-validation
# step doesn't need extra lookups.
#
# Maintenance: small intentionally. Quarterly review at the start of
# each agentic-branch release cycle. New domains added as PI's projects
# surface them.
# =============================================================

schema_version: v1

always_on:
  - name: rka
    type: mcp_stdio
    rationale: |
      RKA knowledge base — provenance-tracked journal entries, decisions,
      missions, literature. Required for the orchestrator workflow itself.
    install_hint: built-in
    secrets: []
    always_on: true

  - name: context7
    type: mcp_stdio
    rationale: |
      Live documentation lookup for libraries / SDKs / APIs. Useful when
      Brain reasons about specific library APIs (LangGraph, FastAPI,
      Claude SDK, framework specifics) — avoids training-data staleness.
    command: npx
    args: ["-y", "@upstash/context7-mcp@latest"]
    install_hint: bundled via npx (Node required)
    secrets: []

  - name: filesystem
    type: mcp_stdio
    rationale: |
      Local filesystem read/write under a configured root. Useful for
      writing-phase missions that produce manuscript drafts, code
      artifacts, or data files.
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem"]
    install_hint: bundled via npx
    secrets: []

  - name: git
    type: mcp_stdio
    rationale: |
      Git operations (status, diff, log, branch) for projects with code
      artifacts. Pairs with `filesystem` for the implementation/writing
      phases.
    command: npx
    args: ["-y", "@modelcontextprotocol/server-git"]
    install_hint: bundled via npx
    secrets: []

