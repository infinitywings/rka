# manuscript.yaml — per-manuscript configuration.
#
# This file glues a workspace to a specific venue + optional CFP URL.
# Read by:
#   - scripts/layout_audit.py    (page limit, anonymization, references-counted)
#   - scripts/ai_tic_lint.py     (forbidden constructions inherited from venue)
#   - mcp_tools/server.py         (writer_get_venue_spec tool surface)
#   - scripts/cfp_loader.py (W2) (URL fetch → cfp_overrides.yaml)
#
# Generated by /rka-start-manuscript with venue + (optional) cfp_url.

schema_version: v1

# === Venue selection (required) ===
venue_id: REPLACE_WITH_VENUE_ID  # e.g., NeurIPS, CHI, JoF, NSF-PAPPG

# === Optional CFP override ===
# Point cfp_loader (Phase W2) at the year-specific call URL. The loader
# fetches + parses it and writes any field-level deltas into
# `cfp_overrides.yaml` in this directory. layout_audit.py + ai_tic_lint.py
# read overrides on top of the base venue spec.
cfp_url: null                    # e.g., https://neurips.cc/Conferences/2025/CallForPapers

# === Project linkage ===
project_id: REPLACE_WITH_PROJECT_ID    # RKA prj_… that this manuscript belongs to
title: REPLACE_WITH_MANUSCRIPT_TITLE
target_track: null                     # nullable; e.g., "long", "short", "industry"
target_deadline: null                  # ISO date; informational

# === Per-manuscript overrides (rare) ===
# Use only when the manuscript needs to depart from the venue baseline.
# Each key here overrides the matching key on the loaded venue spec.
overrides:
  page_limit_main: null                # int OR null (null = use venue baseline)
  citation_style: null                 # see venue_schema.md "Citation style enums"

# === Provenance ===
provenance:
  created_at: REPLACE_WITH_ISO_DATE
  created_by: rka-start-manuscript
