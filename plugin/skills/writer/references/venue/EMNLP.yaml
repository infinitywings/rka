schema_version: v1
id: EMNLP
name: Empirical Methods in Natural Language Processing
kind: conference
domain: cs-ml
status: active
pin_year: 2025

submission:
  page_limit_main: 8
  page_limit_camera_ready: 9
  references_counted: false
  appendix_counted: false
  appendix_limit: null
  has_required_checklist: true
  anonymization: required_pre_camera_ready

format:
  template_id: acl-style-files
  engine_default: pdflatex
  engines_supported: [pdflatex]
  citation_style: name-year
  bibliography_style: alphabetical

structure:
  required_sections:
    - Introduction
    - Related Work
    - Method
    - Experiments
    - Results
    - Limitations
    - References
  optional_sections:
    - Discussion
    - Conclusion
    - Ethics Statement
  appendix_sections:
    - Reproducibility Checklist
    - Additional ablation tables
    - Dataset documentation
    - Hyperparameter sweeps
  section_order:
    - Introduction
    - Related Work
    - Method
    - Experiments
    - Results
    - Discussion
    - Conclusion
    - Limitations
    - Ethics Statement
    - References
  abstract_word_min: 150
  abstract_word_target: 200
  abstract_word_max: 300

tone:
  voice: first-person-plural
  hedging: moderate
  marketing_language: discouraged
  math_density: high
  numerical_claims_dominate: true
  ablation_studies_expected: true
  multi_seed_required: true
  reproducibility_floor: high

review_dimensions:
  - {name: technical_quality, weight: high}
  - {name: novelty, weight: high}
  - {name: empirical_soundness, weight: high}
  - {name: clarity, weight: medium}
  - {name: reproducibility, weight: high}

forbidden_constructions:
  - pattern: "we propose a novel"
    reason: "overused; ACL-family reviewers flag"
    severity: warn
  - pattern: "state-of-the-art"
    reason: "prefer specific metric numbers in head-to-head tables"
    severity: warn
  - pattern: "superior performance"
    reason: "requires explicit head-to-head comparison with significance test"
    severity: warn

sample_corpus:
  query_method: openalex
  filter_template: "primary_location.source.id:S<TBD>,publication_year:{year}"
  recommended_year_range: [2024, 2025]
  diversity_topics:
    - encoder_decoder_modeling
    - evaluation
    - low_resource_languages
    - datasets
    - interpretability
  rka_tag: "venue-sample:EMNLP"

cfp:
  primary_url: https://www.emnlp.org/
  author_guide_url: https://aclrollingreview.org/authorchecklist
  checklist_url: https://aclrollingreview.org/responsibleNLPresearch/
  last_verified: 2026-05-26

provenance:
  schema_origin: dec_01KS0BKJ5ZJKJ4R19GYAK3QN9D
  last_updated: 2026-05-26
