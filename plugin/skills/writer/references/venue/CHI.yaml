schema_version: v1
id: CHI
name: ACM Conference on Human Factors in Computing Systems
kind: conference
domain: cs-hci
status: active
pin_year: 2025

submission:
  page_limit_main: 14
  page_limit_camera_ready: null
  references_counted: false
  appendix_counted: false
  appendix_limit: null
  has_required_checklist: false
  anonymization: required_pre_camera_ready

format:
  template_id: acmart
  engine_default: pdflatex
  engines_supported: [pdflatex, lualatex, xelatex]
  citation_style: numeric-cite-order
  bibliography_style: numeric-cite-order

structure:
  required_sections:
    - Introduction
    - Related Work
    - Method
    - Findings
    - Discussion
    - Limitations
    - References
  optional_sections:
    - Background
    - Conclusion
    - Acknowledgments
  appendix_sections:
    - IRB protocol details
    - Additional qualitative coding excerpts
    - Supplementary system screenshots
  section_order:
    - Introduction
    - Related Work
    - Method
    - Findings
    - Discussion
    - Limitations
    - Conclusion
    - Acknowledgments
    - References
  abstract_word_min: 150
  abstract_word_target: 200
  abstract_word_max: 250

tone:
  voice: first-person-plural
  hedging: high
  marketing_language: discouraged
  math_density: low
  numerical_claims_dominate: false
  ablation_studies_expected: false
  multi_seed_required: false
  reproducibility_floor: moderate

review_dimensions:
  - {name: contribution, weight: high}
  - {name: methodological_rigor, weight: high}
  - {name: scholarly_quality, weight: medium}
  - {name: clarity, weight: medium}
  - {name: relevance_to_hci, weight: high}

forbidden_constructions:
  - pattern: "we propose a novel"
    reason: "overused since 2022; reviewers flag"
    severity: warn
  - pattern: "comprehensive"
    reason: "often used as a hedge against scope criticism"
    severity: warn
  - pattern: "generalizable to all"
    reason: "small-sample qualitative work cannot claim broad generalizability"
    severity: warn

sample_corpus:
  query_method: openalex
  filter_template: "primary_location.source.id:S4310306537,publication_year:{year}"
  recommended_year_range: [2024, 2025]
  diversity_topics:
    - empirical_studies
    - design_research
    - mixed_methods
    - accessibility
    - ai_ux
  rka_tag: "venue-sample:CHI"

cfp:
  primary_url: https://chi.acm.org/
  author_guide_url: https://chi.acm.org/authors/
  checklist_url: null
  last_verified: 2026-05-26

provenance:
  schema_origin: dec_01KS0BKJ5ZJKJ4R19GYAK3QN9D
  last_updated: 2026-05-26
