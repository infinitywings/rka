# =============================================================
# RKA — Research Knowledge Agent
# One-click deployment: docker compose up -d
# =============================================================
#
# Prerequisites:
#   - Docker Desktop (macOS/Windows) or Docker Engine (Linux)
#
# Embeddings are ON by default in v2.4.0 with the FastEmbed backend
# (nomic-ai/nomic-embed-text-v1.5, 768-dim). Switch to LM Studio,
# Ollama, or any OpenAI-compatible HTTP backend at Settings → Embeddings
# in the web UI (config persists at /data/embedding_config.json,
# file-mode 0600).
#
# LLM-driven features (rka_ask, rka_generate_summary) are no longer
# configured here. The orchestrator's Claude Code SDK path handles LLM
# access (separate Phase-2 mission). The /api/llm/* REST routes + the
# rka_ask / rka_generate_summary MCP tools remain in the codebase as a
# graceful-no-op surface for future re-wiring.
#
# Usage:
#   docker compose up -d          # start
#   docker compose logs -f rka    # view logs
#   docker compose down           # stop
#
# Web UI:  http://localhost:9712
# API:     http://localhost:9712/docs
#
# Claude Desktop MCP config (~/.config/Claude/claude_desktop_config.json):
#   {
#     "mcpServers": {
#       "rka": {
#         "command": "docker",
#         "args": ["exec", "-i", "rka-server", "rka", "mcp"]
#       }
#     }
#   }
# =============================================================

services:
  rka:
    build: .
    container_name: rka-server
    ports:
      - "9712:9712"
    volumes:
      - rka-data:/data
    environment:
      RKA_EMBEDDINGS_ENABLED: "true"
      # v2.5.4 (mis_01KRSP44W7BDZH11PZRGXH1WM4): context-engine weighted-sum
      # coefficients. Interpolated from shell env so eval-v2 sweep can swap
      # configs by setting these before `docker compose up -d --force-recreate`.
      # Defaults match the v2.5.3-hypothesis Config 1 in the sweep.
      RKA_CTX_W_IMP: "${RKA_CTX_W_IMP:-0.5}"
      RKA_CTX_W_CENT: "${RKA_CTX_W_CENT:-0.3}"
      # Phase-3.1 T5 cfg11 winner (mis_01KS3EB2671CDD4V9RZCMYCEH1; Brain
      # ratification of chk_01KS3K40N6JRHV118969RMBNF0): w_recency default
      # lowered 0.20 → 0.15.
      RKA_CTX_W_RECENCY: "${RKA_CTX_W_RECENCY:-0.15}"
      RKA_CTX_PI_LIFT: "${RKA_CTX_PI_LIFT:-0.125}"
      # Phase-3.1 T5 cfg11 winner: bundle_K default raised 50 → 80, the
      # Pareto-best point on the recall × efficiency frontier (hits the
      # structural recall ceiling 0.822 while preserving acceptable
      # ordering). Always-on post-rank-merge truncation introduced in T2;
      # T5 pins K at the sweep winner.
      RKA_CTX_BUNDLE_K: "${RKA_CTX_BUNDLE_K:-80}"
      # Phase-3.1 T5 cfg11 winner: recency-decay shape pinned at N=1 (the
      # simplest shape; the sweep showed N ∈ {1, 30, 90, 365} effects were
      # within noise, so backward-compat wins by tie-break). Operator
      # override via RKA_CTX_RECENCY_SHAPE_N preserved.
      RKA_CTX_RECENCY_SHAPE_N: "${RKA_CTX_RECENCY_SHAPE_N:-1}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
  rka-worker:
    build: .
    container_name: rka-worker
    command: ["rka", "worker"]
    healthcheck:
      disable: true
    volumes:
      - rka-data:/data
    environment:
      RKA_EMBEDDINGS_ENABLED: "true"
      # v2.5.4 (mis_01KRSP44W7BDZH11PZRGXH1WM4): context-engine weighted-sum
      # coefficients. Interpolated from shell env so eval-v2 sweep can swap
      # configs by setting these before `docker compose up -d --force-recreate`.
      # Defaults match the v2.5.3-hypothesis Config 1 in the sweep.
      RKA_CTX_W_IMP: "${RKA_CTX_W_IMP:-0.5}"
      RKA_CTX_W_CENT: "${RKA_CTX_W_CENT:-0.3}"
      # Phase-3.1 T5 cfg11 winner (mis_01KS3EB2671CDD4V9RZCMYCEH1; Brain
      # ratification of chk_01KS3K40N6JRHV118969RMBNF0): w_recency default
      # lowered 0.20 → 0.15.
      RKA_CTX_W_RECENCY: "${RKA_CTX_W_RECENCY:-0.15}"
      RKA_CTX_PI_LIFT: "${RKA_CTX_PI_LIFT:-0.125}"
      # Phase-3.1 T5 cfg11 winner: bundle_K default raised 50 → 80, the
      # Pareto-best point on the recall × efficiency frontier (hits the
      # structural recall ceiling 0.822 while preserving acceptable
      # ordering). Always-on post-rank-merge truncation introduced in T2;
      # T5 pins K at the sweep winner.
      RKA_CTX_BUNDLE_K: "${RKA_CTX_BUNDLE_K:-80}"
      # Phase-3.1 T5 cfg11 winner: recency-decay shape pinned at N=1 (the
      # simplest shape; the sweep showed N ∈ {1, 30, 90, 365} effects were
      # within noise, so backward-compat wins by tie-break). Operator
      # override via RKA_CTX_RECENCY_SHAPE_N preserved.
      RKA_CTX_RECENCY_SHAPE_N: "${RKA_CTX_RECENCY_SHAPE_N:-1}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - rka
    restart: unless-stopped

volumes:
  rka-data:
