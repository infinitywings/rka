# =============================================================
# RKA — Research Knowledge Agent
# One-click deployment: docker compose up -d
# =============================================================
#
# Prerequisites:
#   - Docker Desktop (macOS/Windows) or Docker Engine (Linux)
#
# Embeddings are ON by default in v2.4.0 with the FastEmbed backend
# (nomic-ai/nomic-embed-text-v1.5, 768-dim). Switch to LM Studio,
# Ollama, or any OpenAI-compatible HTTP backend at Settings → Embeddings
# in the web UI (config persists at /data/embedding_config.json,
# file-mode 0600).
#
# LLM-driven features (rka_ask, rka_generate_summary) are no longer
# configured here. The orchestrator's Claude Code SDK path handles LLM
# access (separate Phase-2 mission). The /api/llm/* REST routes + the
# rka_ask / rka_generate_summary MCP tools remain in the codebase as a
# graceful-no-op surface for future re-wiring.
#
# Usage:
#   docker compose up -d          # start
#   docker compose logs -f rka    # view logs
#   docker compose down           # stop
#
# Web UI:  http://localhost:9712
# API:     http://localhost:9712/docs
#
# Claude Desktop MCP config (~/.config/Claude/claude_desktop_config.json):
#   {
#     "mcpServers": {
#       "rka": {
#         "command": "docker",
#         "args": ["exec", "-i", "rka-server", "rka", "mcp"]
#       }
#     }
#   }
# =============================================================

services:
  rka:
    build: .
    container_name: rka-server
    ports:
      - "9712:9712"
    volumes:
      - rka-data:/data
    environment:
      RKA_EMBEDDINGS_ENABLED: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
  rka-worker:
    build: .
    container_name: rka-worker
    command: ["rka", "worker"]
    healthcheck:
      disable: true
    volumes:
      - rka-data:/data
    environment:
      RKA_EMBEDDINGS_ENABLED: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - rka
    restart: unless-stopped

volumes:
  rka-data:
